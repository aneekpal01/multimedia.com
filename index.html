<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader Pro</title>
    <style>
        /* Modern UI/UX styling without any CSS frameworks */
        :root { 
            --bg: #0f172a; 
            --card: #1e293b; 
            --text: #f8fafc; 
            --accent: #3b82f6; 
            --success: #10b981;
            --error: #ef4444;
        }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            padding: 2rem; 
        }

        .container { 
            background: var(--card); 
            padding: 2.5rem; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 550px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); 
        }

        h1 { text-align: center; margin-top: 0; font-size: 1.8rem; }
        
        .input-group { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 1rem; 
        }

        input { 
            flex: 1; 
            padding: 14px; 
            border: 1px solid #475569; 
            border-radius: 8px; 
            background: var(--bg); 
            color: white; 
            font-size: 1rem;
            outline: none; 
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); }

        button { 
            padding: 14px 24px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 1rem;
            transition: background 0.2s; 
        }

        button:hover { background: #2563eb; }

        .status { 
            text-align: center; 
            margin: 15px 0; 
            font-size: 0.95rem; 
            color: #94a3b8; 
            font-weight: 500;
        }

        /* Video Player Placeholder */
        .player-container { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 10px; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 1.5rem; 
            border: 1px solid #334155;
        }

        /* Real-time Progress Tracking UI */
        .progress-bar { 
            width: 100%; 
            height: 10px; 
            background: #334155; 
            border-radius: 5px; 
            overflow: hidden; 
            display: none; 
            margin-bottom: 1.5rem; 
        }

        .progress-fill { 
            height: 100%; 
            background: var(--success); 
            width: 0%; 
            transition: width 0.3s ease; 
        }

        .controls { 
            display: none; 
            gap: 15px; 
            justify-content: center; 
        }

        .btn-mp4 { background: var(--accent); }
        .btn-mp3 { background: var(--success); }
        .btn-mp3:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ Media Downloader</h1>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste YT or Insta link here...">
            <button onclick="processUrl()">Search</button>
        </div>
        
        <div class="status" id="statusText">Waiting for a URL...</div>

        <div class="player-container" id="player">
            <span style="color: #64748b;">▶️ Media Player Ready</span>
        </div>

        <div class="progress-bar" id="progressContainer">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="controls" id="downloadControls">
            <button class="btn-mp4" onclick="simulateDownload('MP4')">⬇️ Download MP4</button>
            <button class="btn-mp3" onclick="simulateDownload('MP3')">🎵 Download MP3</button>
        </div>
    </div>

    <script>
        // Pure Vanilla JavaScript - No React/Next.js
        function processUrl() {
            const url = document.getElementById('urlInput').value.trim();
            const statusText = document.getElementById('statusText');
            const controls = document.getElementById('downloadControls');
            const player = document.getElementById('player');
            const progressContainer = document.getElementById('progressContainer');

            // Reset UI
            progressContainer.style.display = "none";
            document.getElementById('progressBar').style.width = "0%";

            if (!url) {
                statusText.innerText = "Bhai, link toh daal do! (Please enter a valid URL)";
                statusText.style.color = "var(--error)";
                return;
            }

            statusText.style.color = "#94a3b8";

            // 🔄 Auto-detect platform from URL using basic string matching
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                statusText.innerText = "🔍 Platform detected: YouTube 🔴";
            } else if (url.includes('instagram.com')) {
                statusText.innerText = "🔍 Platform detected: Instagram 🟣";
            } else {
                statusText.innerText = "Unsupported URL. Only YouTube & Instagram are supported.";
                statusText.style.color = "var(--error)";
                controls.style.display = "none";
                player.style.display = "none";
                return;
            }

            // Reveal UI elements
            player.style.display = "flex";
            controls.style.display = "flex";
        }

        function simulateDownload(format) {
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');

            progressContainer.style.display = "block";
            progressBar.style.width = "0%";
            statusText.style.color = "#94a3b8";
            
            // ⚡ Real-time progress tracking (Simulated for frontend demo)
            // In a real app, this would be tied to Axios/Fetch upload progress events from your backend API
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 12; // Random increment to simulate network speed
                
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    statusText.innerText = `✅ ${format} Download Complete! Check your files.`;
                    statusText.style.color = "var(--success)";
                    
                    // Hide progress bar after completion
                    setTimeout(() => { progressContainer.style.display = "none"; }, 3000);
                } else {
                    statusText.innerText = `Downloading ${format}... ${Math.floor(progress)}%`;
                }
                
                progressBar.style.width = `${progress}%`;
            }, 300);
        }
    </script>
</body>
</html>
